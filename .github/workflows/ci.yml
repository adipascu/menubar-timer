name: CI

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - '*'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/install
      - run: pnpm lint

  format:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/install
      - run: pnpm format:check

  knip:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/install
      - run: pnpm knip

  audit:
    runs-on: macos-15
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/install
      - run: pnpm audit --audit-level high

  gitleaks:
    if: github.event_name == 'pull_request'
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ github.token }}

  test:
    needs: [lint, format, knip]
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/install
      - run: pnpm test

  build:
    needs: [lint, format, knip]
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/install
      - run: pnpm run build:mac
      - run: scripts/report-sizes.sh dist | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: TimerBar-dmg
          path: dist/*.dmg
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build, test]
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: TimerBar-dmg
          path: dist
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: latest
          files: dist/*.dmg
          draft: false
          make_latest: true
      - run: scripts/verify-release.sh latest dist/*.dmg
        env:
          GH_TOKEN: ${{ github.token }}
