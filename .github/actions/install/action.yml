name: Install
description: Pin Node to engines.node, enable corepack, restore the pnpm store and install from the frozen lockfile
runs:
  using: composite
  steps:
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: package.json
    - run: corepack enable
      shell: bash
    - run: node scripts/assert-node-version.js
      shell: bash
    - id: store
      run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      shell: bash
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ${{ steps.store.outputs.path }}
          ~/Library/Caches/electron
        key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: pnpm-${{ runner.os }}-
    - run: pnpm install --frozen-lockfile --engine-strict
      shell: bash
