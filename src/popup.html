<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Coach</title>
    <style>
      :root {
        --card: #fffdf3;
        --border: #d8cfae;
        --ink: #1c1a14;
        --muted: #6f6852;
        --accent: #b8860b;
        --shadow: rgba(0, 0, 0, 0.28);
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --card: #23211c;
          --border: #4a4536;
          --ink: #f2eee0;
          --muted: #a9a189;
          --accent: #e3b341;
          --shadow: rgba(0, 0, 0, 0.55);
        }
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        background: transparent;
        overflow: hidden;
        -webkit-user-select: none;
        cursor: default;
        font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
        color: var(--ink);
      }

      #card {
        margin: 10px;
        padding: 14px 14px 12px;
        display: grid;
        grid-template-columns: 34px 1fr;
        gap: 12px;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 12px;
        box-shadow: 0 10px 28px var(--shadow);
        animation: pop 220ms cubic-bezier(0.2, 1.3, 0.4, 1) both;
      }

      @keyframes pop {
        from {
          opacity: 0;
          transform: translateY(10px) scale(0.96);
        }
      }

      #beacon {
        grid-column: 1 / -1;
        position: relative;
        height: 14px;
        border-radius: 999px;
        overflow: hidden;
        background: #ff1f0f;
        animation: beacon-flash 400ms steps(2, jump-none) infinite;
      }

      #beacon::before {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(100deg, transparent 12%, rgba(255, 255, 255, 0.95) 50%, transparent 88%);
        animation: beacon-sweep 760ms linear infinite;
      }

      #beacon::after {
        content: "";
        position: absolute;
        inset: 3px 4px 3px auto;
        width: 8px;
        border-radius: 50%;
        background: #ffffff;
        animation: beacon-blink 400ms steps(2, jump-none) infinite;
      }

      @keyframes beacon-flash {
        from {
          background-color: #ff1f0f;
        }
        to {
          background-color: #1636ff;
        }
      }

      @keyframes beacon-sweep {
        from {
          transform: translateX(-100%);
        }
        to {
          transform: translateX(100%);
        }
      }

      @keyframes beacon-blink {
        from {
          opacity: 1;
        }
        to {
          opacity: 0.04;
        }
      }

      #clip {
        width: 34px;
        height: 44px;
        animation: peek 3.2s ease-in-out infinite;
      }

      @keyframes peek {
        0%,
        84%,
        100% {
          transform: rotate(0deg);
        }
        88% {
          transform: rotate(-9deg);
        }
        94% {
          transform: rotate(7deg);
        }
      }

      h1 {
        margin: 1px 0 6px;
        font-size: 13px;
        font-weight: 650;
        letter-spacing: -0.1px;
      }

      p {
        margin: 0;
        color: var(--ink);
      }

      footer {
        margin-top: 10px;
        display: flex;
        align-items: center;
        gap: 8px;
      }

      #source {
        flex: 1;
        min-width: 0;
        color: var(--muted);
        font-size: 11px;
        text-decoration: none;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      #source:hover {
        color: var(--accent);
        text-decoration: underline;
      }

      button {
        flex: none;
        font: inherit;
        font-size: 11px;
        font-weight: 600;
        color: var(--ink);
        padding: 4px 12px;
        border: 1px solid var(--border);
        border-radius: 999px;
        background: transparent;
      }

      button:hover {
        background: var(--accent);
        border-color: var(--accent);
        color: var(--card);
      }

      button.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: var(--card);
      }

      button.primary:hover {
        filter: brightness(1.12);
      }
    </style>
  </head>
  <body>
    <div id="card">
      <div id="beacon" aria-hidden="true"></div>
      <svg id="clip" viewBox="0 0 34 44" fill="none" aria-hidden="true">
        <path
          d="M24 13v18a8 8 0 0 1-16 0V11a5 5 0 0 1 10 0v18a2.5 2.5 0 0 1-5 0V14"
          stroke="var(--accent)"
          stroke-width="3.2"
          stroke-linecap="round"
        />
        <circle cx="13.5" cy="17" r="1.9" fill="var(--ink)" />
        <circle cx="21" cy="17" r="1.9" fill="var(--ink)" />
      </svg>
      <div>
        <h1 id="title"></h1>
        <p id="body"></p>
        <footer>
          <a id="source" href="#"></a>
          <button id="snooze"></button>
          <button id="discuss">Talk it through</button>
          <button id="dismiss" class="primary">OK</button>
        </footer>
      </div>
    </div>

    <script>
      const card = document.getElementById('card')
      const beacon = document.getElementById('beacon')
      const title = document.getElementById('title')
      const body = document.getElementById('body')
      const source = document.getElementById('source')
      const snooze = document.getElementById('snooze')
      const discuss = document.getElementById('discuss')

      const BEACON_STYLE = { display: 'block', visibility: 'visible', opacity: '1' }

      const keepBeaconVisible = () => {
        if (!beacon.isConnected) (card.isConnected ? card : document.body).prepend(beacon)
        beacon.hidden = false
        for (const [property, value] of Object.entries(BEACON_STYLE)) {
          if (beacon.style.getPropertyValue(property) !== value) {
            beacon.style.setProperty(property, value, 'important')
          }
        }
      }

      keepBeaconVisible()
      new MutationObserver(keepBeaconVisible).observe(document.documentElement, {
        childList: true,
        subtree: true,
        attributes: true,
      })
      setInterval(keepBeaconVisible, 200)

      window.coach.onTip((tip) => {
        title.textContent = tip.title
        body.textContent = tip.body
        source.textContent = tip.source ?? ''
        source.href = tip.url ?? '#'
        source.hidden = !tip.url
        snooze.textContent = tip.snoozeLabel ?? ''
        snooze.hidden = !tip.snoozeLabel
        discuss.hidden = tip.kind === 'nudge'
        requestAnimationFrame(() => {
          window.coach.reportHeight(card.offsetHeight + 20)
        })
      })

      source.addEventListener('click', (event) => {
        event.preventDefault()
        window.coach.openSource(source.href)
      })

      snooze.addEventListener('click', () => window.coach.snooze())
      discuss.addEventListener('click', () => window.coach.discuss())
      document.getElementById('dismiss').addEventListener('click', () => window.coach.dismiss())
    </script>
  </body>
</html>
