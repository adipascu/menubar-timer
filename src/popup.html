<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Coach</title>
    <style>
      :root {
        --card: #fffdf3;
        --border: #d8cfae;
        --ink: #1c1a14;
        --muted: #6f6852;
        --accent: #b8860b;
        --shadow: rgba(0, 0, 0, 0.28);
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --card: #23211c;
          --border: #4a4536;
          --ink: #f2eee0;
          --muted: #a9a189;
          --accent: #e3b341;
          --shadow: rgba(0, 0, 0, 0.55);
        }
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        background: transparent;
        overflow: hidden;
        -webkit-user-select: none;
        cursor: default;
        font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
        color: var(--ink);
      }

      #card {
        margin: 10px;
        padding: 14px 14px 12px;
        display: grid;
        grid-template-columns: 34px 1fr;
        gap: 12px;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 12px;
        box-shadow: 0 10px 28px var(--shadow);
        animation: pop 220ms cubic-bezier(0.2, 1.3, 0.4, 1) both;
      }

      @keyframes pop {
        from {
          opacity: 0;
          transform: translateY(10px) scale(0.96);
        }
      }

      #beacon {
        grid-column: 1 / -1;
        display: block;
        width: 100%;
        height: 18px;
        border-radius: 5px;
        background: var(--beacon-ground, #020803);
        box-shadow: 0 0 0 1px var(--beacon-edge, #0f3a17), 0 0 12px var(--beacon-halo, rgba(57, 255, 20, 0.3));
        transition: opacity 180ms ease;
      }

      #beacon.bell {
        box-shadow: 0 0 0 1px var(--beacon-bell, #39ff14), 0 0 24px var(--beacon-bell-halo, rgba(57, 255, 20, 0.85));
        outline: 1px solid var(--beacon-bell, #39ff14);
        outline-offset: -1px;
      }

      #clip {
        width: 34px;
        height: 44px;
        animation: peek 3.2s ease-in-out infinite;
      }

      @keyframes peek {
        0%,
        84%,
        100% {
          transform: rotate(0deg);
        }
        88% {
          transform: rotate(-9deg);
        }
        94% {
          transform: rotate(7deg);
        }
      }

      h1 {
        margin: 1px 0 6px;
        font-size: 13px;
        font-weight: 650;
        letter-spacing: -0.1px;
      }

      p {
        margin: 0;
        color: var(--ink);
      }

      footer {
        margin-top: 10px;
        display: grid;
        gap: 8px;
      }

      #actions {
        display: flex;
        flex-wrap: wrap;
        justify-content: flex-end;
        gap: 6px;
      }

      #source {
        color: var(--muted);
        font-size: 11px;
        text-decoration: none;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        -webkit-user-select: text;
        -webkit-user-drag: none;
      }

      #source:hover {
        color: var(--accent);
        text-decoration: underline;
      }

      #title,
      #body {
        -webkit-user-select: text;
        cursor: text;
      }

      #site-line {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip-path: inset(50%);
        white-space: nowrap;
        -webkit-user-select: text;
      }

      ::selection {
        background: color-mix(in srgb, var(--accent) 35%, transparent);
      }

      button {
        flex: none;
        font: inherit;
        font-size: 11px;
        font-weight: 600;
        color: var(--ink);
        padding: 4px 12px;
        border: 1px solid var(--border);
        border-radius: 999px;
        background: transparent;
      }

      button:hover {
        background: var(--accent);
        border-color: var(--accent);
        color: var(--card);
      }

      button.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: var(--card);
      }

      button.primary:hover {
        filter: brightness(1.12);
      }
    </style>
  </head>
  <body>
    <div id="card">
      <canvas id="beacon" aria-hidden="true"></canvas>
      <svg id="clip" viewBox="0 0 34 44" fill="none" aria-hidden="true">
        <path
          d="M24 13v18a8 8 0 0 1-16 0V11a5 5 0 0 1 10 0v18a2.5 2.5 0 0 1-5 0V14"
          stroke="var(--accent)"
          stroke-width="3.2"
          stroke-linecap="round"
        />
        <circle cx="13.5" cy="17" r="1.9" fill="var(--ink)" />
        <circle cx="21" cy="17" r="1.9" fill="var(--ink)" />
      </svg>
      <div>
        <h1 id="title"></h1>
        <p id="site-line" aria-hidden="true"></p>
        <p id="body"></p>
        <footer>
          <a id="source" href="#"></a>
          <div id="actions">
            <button id="known" title="Retire this card, you have it covered">Already know this</button>
            <button id="not-interested" title="Retire this card and steer the tune-up away from it">Not interested</button>
            <button id="more-like-this" title="Keep this card in play and steer the tune-up and the quiz toward it">More like this</button>
            <button id="discuss">Talk it through</button>
            <button id="dismiss" class="primary">Got it</button>
          </div>
        </footer>
      </div>
    </div>

    <script src="beacons.js"></script>
    <script>
      const card = document.getElementById('card')
      const beacon = document.getElementById('beacon')
      const title = document.getElementById('title')
      const body = document.getElementById('body')
      const source = document.getElementById('source')
      const known = document.getElementById('known')
      const notInterested = document.getElementById('not-interested')
      const moreLikeThis = document.getElementById('more-like-this')
      const discuss = document.getElementById('discuss')

      let calm = false

      const keepBeaconVisible = () => {
        if (!beacon.isConnected) (card.isConnected ? card : document.body).prepend(beacon)
        beacon.hidden = false
        const wanted = { display: 'block', visibility: 'visible', opacity: calm ? '0' : '1' }
        for (const [property, value] of Object.entries(wanted)) {
          if (beacon.style.getPropertyValue(property) !== value) {
            beacon.style.setProperty(property, value, 'important')
          }
        }
      }

      keepBeaconVisible()
      new MutationObserver(keepBeaconVisible).observe(document.documentElement, {
        childList: true,
        subtree: true,
        attributes: true,
      })
      setInterval(keepBeaconVisible, 200)

      const FRAME_MS = 33
      const MAX_STEP_MS = 100

      let runner = null
      let started = null
      let lastFrame = 0
      let frameRequest = 0
      let loudMusic = false

      const loop = (now) => {
        frameRequest = requestAnimationFrame(loop)
        if (now - lastFrame < FRAME_MS) return
        const first = started === null
        started ??= now
        const t = now - started
        const dt = first ? FRAME_MS : Math.min(now - lastFrame, MAX_STEP_MS)
        lastFrame = now
        runner.frame(t, dt)
      }

      const pause = () => cancelAnimationFrame(frameRequest)

      const resume = () => {
        pause()
        if (runner && !calm) frameRequest = requestAnimationFrame(loop)
      }

      const setCalm = (next) => {
        calm = next
        keepBeaconVisible()
        if (calm) pause()
        else resume()
      }

      card.addEventListener('mouseenter', () => setCalm(true))
      card.addEventListener('mouseleave', () => setCalm(false))

      const siteLine = document.getElementById('site-line')
      const showSiteLine = (text) => {
        siteLine.textContent = text ?? ''
        siteLine.hidden = !text
      }

      const selectedText = () => window.getSelection().toString()

      document.addEventListener('mouseup', () => {
        if (selectedText()) window.coach.selected()
      })

      document.addEventListener('copy', (event) => {
        if (source.hidden || !window.getSelection().containsNode(source, true)) return
        event.clipboardData.setData('text/plain', `${selectedText().trimEnd()}\n${source.href}`)
        event.preventDefault()
      })

      document.addEventListener('keydown', (event) => {
        if (event.key === 'Escape') window.coach.dismiss()
      })

      window.coach.onTip((tip) => {
        title.textContent = tip.title
        showSiteLine(tip.siteLine)
        body.textContent = tip.body
        source.textContent = tip.source ?? ''
        source.href = tip.url ?? '#'
        source.hidden = !tip.url
        known.hidden = !tip.topic
        notInterested.hidden = !tip.topic
        moreLikeThis.hidden = !tip.topic
        discuss.hidden = tip.kind === 'nudge'
        requestAnimationFrame(() => {
          window.coach.reportHeight(card.offsetHeight + 20)
        })
        loudMusic = Boolean(tip.loudMusic)
        runner = BEACONS.start(beacon, tip.beacon, loudMusic)
        resume()
      })

      window.coach.onBeacon((preset) => {
        runner = BEACONS.start(beacon, preset, loudMusic)
        resume()
      })

      window.coach.onSiteLine(showSiteLine)

      source.addEventListener('click', (event) => {
        event.preventDefault()
        if (selectedText()) return
        window.coach.openSource(source.href)
      })

      known.addEventListener('click', () => window.coach.markKnown())
      notInterested.addEventListener('click', () => window.coach.markNotInterested())
      moreLikeThis.addEventListener('click', () => window.coach.markInterested())
      discuss.addEventListener('click', () => window.coach.discuss())
      document.getElementById('dismiss').addEventListener('click', () => window.coach.dismiss())
    </script>
  </body>
</html>
